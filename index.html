<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid | loup</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Avenir', 'Avenir Next', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            transition: background 0.3s;
        }

        body.dark-mode {
            background: #000000;
        }

        body.dark-mode .container {
            color: #ffffff;
        }

        body.dark-mode .controls,
        body.dark-mode .subdivisions-section,
        body.dark-mode .presets-section {
            border-color: #ffffff;
        }

        body.dark-mode h1,
        body.dark-mode h2,
        body.dark-mode label {
            color: #ffffff;
        }

        body.dark-mode input[type="file"],
        body.dark-mode input[type="number"],
        body.dark-mode input[type="text"],
        body.dark-mode input[type="checkbox"],
        body.dark-mode input[type="range"],
        body.dark-mode select {
            border-color: #ffffff;
            background: #000000;
            color: #ffffff;
        }

        body.dark-mode input[type="file"]:hover {
            background: #ffffff;
            color: #000000;
        }

        body.dark-mode .canvas-container {
            border-color: #ffffff;
            background: #000000;
        }

        body.dark-mode button {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        body.dark-mode button:hover {
            background: #000000;
            color: #ffffff;
        }

        body.dark-mode button:disabled {
            background: #000000;
            color: #333333;
            border-color: #333333;
        }

        body.dark-mode .subdivision-option {
            border-bottom-color: #333333;
        }

        body.dark-mode .info-text {
            color: #999999;
        }

        body.dark-mode .preset-item {
            border-color: #ffffff;
        }

        body.dark-mode .preset-item:hover {
            background: #1a1a1a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            color: #000000;
            font-size: 1.5em;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .mode-toggle, .language-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mode-toggle label, .language-selector label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #000000;
            background: #ffffff;
            font-family: 'Avenir', 'Avenir Next', sans-serif;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            border: 1px solid #000000;
            padding: 30px;
            margin-bottom: 40px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #000000;
            font-weight: 400;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 15px;
            border: 1px solid #000000;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Avenir', 'Avenir Next', sans-serif;
        }

        input[type="file"]:hover {
            background: #000000;
            color: #ffffff;
        }

        input[type="number"], input[type="color"], input[type="text"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #000000;
            font-size: 16px;
            font-family: 'Avenir', 'Avenir Next', sans-serif;
            background: #ffffff;
        }

        input[type="range"] {
            padding: 0;
            height: 40px;
        }

        input[type="number"]:focus, input[type="color"]:focus, input[type="text"]:focus, select:focus {
            outline: 2px solid #000000;
            outline-offset: 2px;
        }

        input[type="color"] {
            height: 50px;
            cursor: pointer;
        }

        .opacity-control {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .opacity-control input[type="range"] {
            flex: 1;
        }

        .opacity-value {
            min-width: 50px;
            text-align: center;
            font-weight: 600;
        }

        .canvas-container {
            text-align: center;
            margin: 40px 0;
            border: 1px solid #000000;
            padding: 30px;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .preview-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border: 1px solid #000000;
        }

        body.dark-mode .preview-toggle {
            background: rgba(0, 0, 0, 0.9);
            border-color: #ffffff;
        }

        .preview-toggle label {
            margin: 0;
            font-size: 12px;
            cursor: pointer;
        }

        .preview-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 50px;
            font-size: 14px;
            font-weight: 400;
            border: 1px solid #000000;
            background: #000000;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-family: 'Avenir', 'Avenir Next', sans-serif;
        }

        button:hover {
            background: #ffffff;
            color: #000000;
        }

        button:disabled {
            background: #ffffff;
            color: #cccccc;
            border-color: #cccccc;
            cursor: not-allowed;
        }

        .info-text {
            text-align: center;
            color: #666666;
            font-size: 13px;
            margin-top: 30px;
            letter-spacing: 0.5px;
        }

        .grid-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
        }

        .subdivisions-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #000000;
        }

        .subdivisions-section h2 {
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #000000;
        }

        .subdivision-option {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        .subdivision-option:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
            margin-right: 12px;
            cursor: pointer;
            border: 1px solid #000000;
        }

        .checkbox-label {
            margin: 0;
            font-size: 15px;
            text-transform: none;
            letter-spacing: 0.3px;
            cursor: pointer;
        }

        .subdivision-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-left: 32px;
        }

        .presets-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 1px solid #000000;
        }

        .presets-section h2 {
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #000000;
        }

        .preset-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .preset-controls input[type="text"] {
            flex: 1;
            min-width: 200px;
        }

        .preset-controls button {
            padding: 12px 30px;
        }

        .presets-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .preset-item {
            border: 1px solid #000000;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preset-item:hover {
            background: #f5f5f5;
        }

        .preset-name {
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .preset-delete {
            background: none;
            border: none;
            color: #ff0000;
            cursor: pointer;
            padding: 5px;
            font-size: 18px;
            line-height: 1;
        }

        .preset-delete:hover {
            color: #cc0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-controls">
            <h1><span data-i18n="title">Grid Tool for Artists</span></h1>
            <div class="header-right">
                <div class="language-selector">
                    <label for="languageSelect" data-i18n="language">Language</label>
                    <select id="languageSelect">
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>
                <div class="mode-toggle">
                    <input type="checkbox" id="darkMode">
                    <label for="darkMode" data-i18n="darkMode">Dark Mode</label>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="imageUpload">📁 <span data-i18n="uploadImage">Upload an image:</span></label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <div class="grid-controls">
                <div class="control-group">
                    <label for="gridSize" data-i18n="gridSize">Number of squares:</label>
                    <input type="number" id="gridSize" value="10" min="2" max="100">
                </div>

                <div class="control-group">
                    <label for="lineWidth" data-i18n="lineWidth">Border thickness (px):</label>
                    <input type="number" id="lineWidth" value="2" min="1" max="10">
                </div>

                <div class="control-group">
                    <label for="gridColor" data-i18n="gridColor">Grid color:</label>
                    <input type="color" id="gridColor" value="#000000">
                </div>
            </div>

            <div class="control-group">
                <label for="gridOpacity" data-i18n="gridOpacity">Grid opacity:</label>
                <div class="opacity-control">
                    <input type="range" id="gridOpacity" min="0" max="100" value="100">
                    <span class="opacity-value" id="opacityValue">100%</span>
                </div>
            </div>

            <div class="control-group">
                <div class="checkbox-row">
                    <input type="checkbox" id="showRuler">
                    <label for="showRuler" class="checkbox-label" data-i18n="showRuler">Show numbered axes</label>
                </div>
            </div>

            <div class="subdivisions-section">
                <h2 data-i18n="subdivisionOptions">Subdivision Options</h2>
                
                <div class="subdivision-option">
                    <div class="checkbox-row">
                        <input type="checkbox" id="subdivide4">
                        <label for="subdivide4" class="checkbox-label" data-i18n="subdivide4">Divide into 4 small squares</label>
                    </div>
                    <div class="subdivision-controls">
                        <div class="control-group">
                            <label for="subdivide4Width" data-i18n="thickness">Thickness (px):</label>
                            <input type="number" id="subdivide4Width" value="1" min="1" max="10">
                        </div>
                        <div class="control-group">
                            <label for="subdivide4Color" data-i18n="color">Color:</label>
                            <input type="color" id="subdivide4Color" value="#666666">
                        </div>
                    </div>
                </div>

                <div class="subdivision-option">
                    <div class="checkbox-row">
                        <input type="checkbox" id="subdivide9">
                        <label for="subdivide9" class="checkbox-label" data-i18n="subdivide9">Divide into 9 small squares</label>
                    </div>
                    <div class="subdivision-controls">
                        <div class="control-group">
                            <label for="subdivide9Width" data-i18n="thickness">Thickness (px):</label>
                            <input type="number" id="subdivide9Width" value="1" min="1" max="10">
                        </div>
                        <div class="control-group">
                            <label for="subdivide9Color" data-i18n="color">Color:</label>
                            <input type="color" id="subdivide9Color" value="#999999">
                        </div>
                    </div>
                </div>

                <div class="subdivision-option">
                    <div class="checkbox-row">
                        <input type="checkbox" id="addCircle">
                        <label for="addCircle" class="checkbox-label" data-i18n="addCircle">Add inscribed circle</label>
                    </div>
                    <div class="subdivision-controls">
                        <div class="control-group">
                            <label for="circleWidth" data-i18n="thickness">Thickness (px):</label>
                            <input type="number" id="circleWidth" value="1" min="1" max="10">
                        </div>
                        <div class="control-group">
                            <label for="circleColor" data-i18n="color">Color:</label>
                            <input type="color" id="circleColor" value="#0000ff">
                        </div>
                    </div>
                </div>
            </div>

            <div class="presets-section">
                <h2 data-i18n="presets">Presets</h2>
                <div class="preset-controls">
                    <input type="text" id="presetName" data-i18n-placeholder="presetName" placeholder="Preset name">
                    <button id="savePresetBtn" data-i18n="savePreset">Save</button>
                </div>
                <div class="presets-list" id="presetsList"></div>
            </div>
        </div>

        <div class="canvas-container">
            <div class="preview-toggle">
                <input type="checkbox" id="previewToggle" checked>
                <label for="previewToggle" data-i18n="showGrid">Show grid</label>
            </div>
            <canvas id="canvas"></canvas>
        </div>

        <div class="button-group">
            <button class="btn-download" id="downloadBtn" disabled data-i18n="download">Download image with grid</button>
        </div>

        <p class="info-text" data-i18n="infoText">Upload an image and adjust the grid settings to your needs</p>
    </div>

    <script>
        // Translation object
        const translations = {
            en: {
                title: "Grid Tool for Artists",
                language: "Language",
                darkMode: "Dark Mode",
                uploadImage: "Upload an image:",
                gridSize: "Number of squares:",
                lineWidth: "Border thickness (px):",
                gridColor: "Grid color:",
                gridOpacity: "Grid opacity:",
                showRuler: "Show numbered axes",
                subdivisionOptions: "Subdivision Options",
                subdivide4: "Divide into 4 small squares",
                subdivide9: "Divide into 9 small squares",
                addCircle: "Add inscribed circle",
                thickness: "Thickness (px):",
                color: "Color:",
                presets: "Presets",
                presetName: "Preset name",
                savePreset: "Save",
                showGrid: "Show grid",
                download: "Download image with grid",
                infoText: "Upload an image and adjust the grid settings to your needs",
                alertPresetName: "Please enter a preset name"
            },
            ja: {
                title: "アーティスト用グリッドツール",
                language: "言語",
                darkMode: "ダークモード",
                uploadImage: "画像をアップロード：",
                gridSize: "正方形の数：",
                lineWidth: "線の太さ（px）：",
                gridColor: "グリッドの色：",
                gridOpacity: "グリッドの不透明度：",
                showRuler: "番号付き軸を表示",
                subdivisionOptions: "分割オプション",
                subdivide4: "4つの小さな正方形に分割",
                subdivide9: "9つの小さな正方形に分割",
                addCircle: "内接円を追加",
                thickness: "太さ（px）：",
                color: "色：",
                presets: "プリセット",
                presetName: "プリセット名",
                savePreset: "保存",
                showGrid: "グリッドを表示",
                download: "グリッド付き画像をダウンロード",
                infoText: "画像をアップロードして、必要に応じてグリッド設定を調整してください",
                alertPresetName: "プリセット名を入力してください"
            }
        };

        let currentLanguage = 'en';

        function updateLanguage(lang) {
            currentLanguage = lang;
            const trans = translations[lang];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (trans[key]) {
                    el.textContent = trans[key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (trans[key]) {
                    el.placeholder = trans[key];
                }
            });

            localStorage.setItem('gridLanguage', lang);
        }

        const imageUpload = document.getElementById('imageUpload');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const gridSizeInput = document.getElementById('gridSize');
        const lineWidthInput = document.getElementById('lineWidth');
        const gridColorInput = document.getElementById('gridColor');
        const gridOpacityInput = document.getElementById('gridOpacity');
        const opacityValue = document.getElementById('opacityValue');
        const downloadBtn = document.getElementById('downloadBtn');
        const darkModeToggle = document.getElementById('darkMode');
        const previewToggle = document.getElementById('previewToggle');
        const showRulerCheckbox = document.getElementById('showRuler');
        const languageSelect = document.getElementById('languageSelect');

        const subdivide4Checkbox = document.getElementById('subdivide4');
        const subdivide4WidthInput = document.getElementById('subdivide4Width');
        const subdivide4ColorInput = document.getElementById('subdivide4Color');

        const subdivide9Checkbox = document.getElementById('subdivide9');
        const subdivide9WidthInput = document.getElementById('subdivide9Width');
        const subdivide9ColorInput = document.getElementById('subdivide9Color');

        const addCircleCheckbox = document.getElementById('addCircle');
        const circleWidthInput = document.getElementById('circleWidth');
        const circleColorInput = document.getElementById('circleColor');

        const presetNameInput = document.getElementById('presetName');
        const savePresetBtn = document.getElementById('savePresetBtn');
        const presetsList = document.getElementById('presetsList');

        let uploadedImage = null;
        let presets = {};

        // Charger les préférences au démarrage
        document.addEventListener('DOMContentLoaded', function() {
            // Détecter la langue du navigateur et définir la langue par défaut
            const browserLang = navigator.language || navigator.userLanguage;
            const defaultLang = browserLang.startsWith('ja') ? 'ja' : 'en';
            
            // Charger la langue sauvegardée ou utiliser la langue du navigateur
            const savedLanguage = localStorage.getItem('gridLanguage') || defaultLang;
            languageSelect.value = savedLanguage;
            updateLanguage(savedLanguage);

            // Charger le mode sombre
            const savedDarkMode = localStorage.getItem('gridDarkMode') === 'true';
            if (savedDarkMode) {
                darkModeToggle.checked = true;
                document.body.classList.add('dark-mode');
            }
        });

        languageSelect.addEventListener('change', (e) => {
            updateLanguage(e.target.value);
        });

        darkModeToggle.addEventListener('change', () => {
            const isDarkMode = darkModeToggle.checked;
            document.body.classList.toggle('dark-mode', isDarkMode);
            localStorage.setItem('gridDarkMode', isDarkMode);
        });

        // Charger les presets
        const savedPresets = localStorage.getItem('gridPresets');
        if (savedPresets) {
            presets = JSON.parse(savedPresets);
            renderPresets();
        }

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        uploadedImage = img;
                        drawImageWithGrid();
                        downloadBtn.disabled = false;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        gridSizeInput.addEventListener('input', drawImageWithGrid);
        lineWidthInput.addEventListener('input', drawImageWithGrid);
        gridColorInput.addEventListener('input', drawImageWithGrid);
        gridOpacityInput.addEventListener('input', () => {
            opacityValue.textContent = gridOpacityInput.value + '%';
            drawImageWithGrid();
        });
        showRulerCheckbox.addEventListener('change', drawImageWithGrid);

        subdivide4Checkbox.addEventListener('change', drawImageWithGrid);
        subdivide4WidthInput.addEventListener('input', drawImageWithGrid);
        subdivide4ColorInput.addEventListener('input', drawImageWithGrid);

        subdivide9Checkbox.addEventListener('change', drawImageWithGrid);
        subdivide9WidthInput.addEventListener('input', drawImageWithGrid);
        subdivide9ColorInput.addEventListener('input', drawImageWithGrid);

        addCircleCheckbox.addEventListener('change', drawImageWithGrid);
        circleWidthInput.addEventListener('input', drawImageWithGrid);
        circleColorInput.addEventListener('input', drawImageWithGrid);

        previewToggle.addEventListener('change', drawImageWithGrid);

        function drawImageWithGrid() {
            if (!uploadedImage) return;

            canvas.width = uploadedImage.width;
            canvas.height = uploadedImage.height;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(uploadedImage, 0, 0);

            if (!previewToggle.checked) return;

            const gridSize = parseInt(gridSizeInput.value);
            const lineWidth = parseInt(lineWidthInput.value);
            const gridColor = gridColorInput.value;
            const opacity = parseInt(gridOpacityInput.value) / 100;

            ctx.globalAlpha = opacity;

            const squareSize = Math.min(canvas.width, canvas.height) / gridSize;
            const numSquaresWidth = Math.ceil(canvas.width / squareSize);
            const numSquaresHeight = Math.ceil(canvas.height / squareSize);

            if (subdivide4Checkbox.checked) {
                drawSubdivision(squareSize, numSquaresWidth, numSquaresHeight, 2, 
                    parseInt(subdivide4WidthInput.value), subdivide4ColorInput.value);
            }

            if (subdivide9Checkbox.checked) {
                drawSubdivision(squareSize, numSquaresWidth, numSquaresHeight, 3, 
                    parseInt(subdivide9WidthInput.value), subdivide9ColorInput.value);
            }

            if (addCircleCheckbox.checked) {
                drawCircles(squareSize, numSquaresWidth, numSquaresHeight, 
                    parseInt(circleWidthInput.value), circleColorInput.value);
            }

            ctx.strokeStyle = gridColor;
            ctx.lineWidth = lineWidth;

            for (let i = 0; i <= numSquaresWidth; i++) {
                ctx.beginPath();
                ctx.moveTo(i * squareSize, 0);
                ctx.lineTo(i * squareSize, canvas.height);
                ctx.stroke();
            }

            for (let i = 0; i <= numSquaresHeight; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * squareSize);
                ctx.lineTo(canvas.width, i * squareSize);
                ctx.stroke();
            }

            if (showRulerCheckbox.checked) {
                drawRulers(squareSize, numSquaresWidth, numSquaresHeight, gridColor);
            }

            ctx.globalAlpha = 1;
        }

        function drawSubdivision(squareSize, numSquaresWidth, numSquaresHeight, divisions, lineWidth, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;

            const subSquareSize = squareSize / divisions;

            for (let row = 0; row < numSquaresHeight; row++) {
                for (let col = 0; col < numSquaresWidth; col++) {
                    const startX = col * squareSize;
                    const startY = row * squareSize;

                    for (let i = 1; i < divisions; i++) {
                        ctx.beginPath();
                        ctx.moveTo(startX + i * subSquareSize, startY);
                        ctx.lineTo(startX + i * subSquareSize, Math.min(startY + squareSize, canvas.height));
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(startX, startY + i * subSquareSize);
                        ctx.lineTo(Math.min(startX + squareSize, canvas.width), startY + i * subSquareSize);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawCircles(squareSize, numSquaresWidth, numSquaresHeight, lineWidth, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;

            const radius = squareSize / 2;

            for (let row = 0; row < numSquaresHeight; row++) {
                for (let col = 0; col < numSquaresWidth; col++) {
                    const centerX = col * squareSize + squareSize / 2;
                    const centerY = row * squareSize + squareSize / 2;

                    if (centerX - radius < canvas.width && centerY - radius < canvas.height) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawRulers(squareSize, numSquaresWidth, numSquaresHeight, color) {
            ctx.fillStyle = color;
            ctx.font = 'bold 16px Avenir, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < numSquaresWidth; i++) {
                const x = i * squareSize + squareSize / 2;
                const y = 20;
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(x - 15, y - 12, 30, 24);
                
                ctx.fillStyle = color;
                ctx.fillText((i + 1).toString(), x, y);
            }

            ctx.textAlign = 'center';
            for (let i = 0; i < numSquaresHeight; i++) {
                const x = 20;
                const y = i * squareSize + squareSize / 2;
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(x - 15, y - 12, 30, 24);
                
                ctx.fillStyle = color;
                ctx.fillText((i + 1).toString(), x, y);
            }
        }

        savePresetBtn.addEventListener('click', () => {
            const name = presetNameInput.value.trim();
            if (!name) {
                alert(translations[currentLanguage].alertPresetName);
                return;
            }

            const preset = {
                gridSize: gridSizeInput.value,
                lineWidth: lineWidthInput.value,
                gridColor: gridColorInput.value,
                gridOpacity: gridOpacityInput.value,
                showRuler: showRulerCheckbox.checked,
                subdivide4: subdivide4Checkbox.checked,
                subdivide4Width: subdivide4WidthInput.value,
                subdivide4Color: subdivide4ColorInput.value,
                subdivide9: subdivide9Checkbox.checked,
                subdivide9Width: subdivide9WidthInput.value,
                subdivide9Color: subdivide9ColorInput.value,
                addCircle: addCircleCheckbox.checked,
                circleWidth: circleWidthInput.value,
                circleColor: circleColorInput.value
            };

            presets[name] = preset;
            localStorage.setItem('gridPresets', JSON.stringify(presets));
            presetNameInput.value = '';
            renderPresets();
        });

        function renderPresets() {
            presetsList.innerHTML = '';
            for (const [name, preset] of Object.entries(presets)) {
                const item = document.createElement('div');
                item.className = 'preset-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'preset-name';
                nameSpan.textContent = name;
                nameSpan.onclick = () => loadPreset(preset);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'preset-delete';
                deleteBtn.textContent = '×';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deletePreset(name);
                };
                
                item.appendChild(nameSpan);
                item.appendChild(deleteBtn);
                presetsList.appendChild(item);
            }
        }

        function loadPreset(preset) {
            gridSizeInput.value = preset.gridSize;
            lineWidthInput.value = preset.lineWidth;
            gridColorInput.value = preset.gridColor;
            gridOpacityInput.value = preset.gridOpacity;
            opacityValue.textContent = preset.gridOpacity + '%';
            showRulerCheckbox.checked = preset.showRuler;
            
            subdivide4Checkbox.checked = preset.subdivide4;
            subdivide4WidthInput.value = preset.subdivide4Width;
            subdivide4ColorInput.value = preset.subdivide4Color;
            
            subdivide9Checkbox.checked = preset.subdivide9;
            subdivide9WidthInput.value = preset.subdivide9Width;
            subdivide9ColorInput.value = preset.subdivide9Color;
            
            addCircleCheckbox.checked = preset.addCircle;
            circleWidthInput.value = preset.circleWidth;
            circleColorInput.value = preset.circleColor;
            
            drawImageWithGrid();
        }

        function deletePreset(name) {
            delete presets[name];
            localStorage.setItem('gridPresets', JSON.stringify(presets));
            renderPresets();
        }

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'image_avec_grille.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
